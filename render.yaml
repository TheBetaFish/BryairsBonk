services:
  - type: web
    name: bryairsbonk-api
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm run web-client
    healthCheckPath: /api/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: ALLOWED_ORIGINS
        value: https://thebetafish.github.io
